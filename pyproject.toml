[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gatewatch"
dynamic = ["version"]
description = "Infrastructure events, delivered through pluggable notification channels."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "YouRooni", email = "studio.rooni@gmail.com"}]
dependencies = ["aiohttp>=3.14.5,<4", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["ruff==0.17.4", "build>=1.2,<2", "twine>=6,<7", "pip-audit>=2.9,<4"]
geo = ["geoip2>=4.8,<6"]

[project.scripts]
gatewatch = "gatewatch.cli:main"
gatewatch-manage = "gatewatch.installation:main"

[project.entry-points."gatewatch.sources"]
journal = "gatewatch.sources.journal:JournalSource"
file = "gatewatch.sources.file:FileSource"
demo = "gatewatch.sources.demo:DemoSource"

[project.entry-points."gatewatch.channels"]
telegram = "gatewatch.channels.telegram:TelegramChannel"

[project.entry-points."gatewatch.actions"]
fail2ban = "gatewatch.actions.fail2ban:Fail2banActions"
demo = "gatewatch.actions.demo:DemoActions"

[tool.setuptools.packages.find]
include = ["gatewatch*"]

[tool.setuptools.dynamic]
version = {attr = "gatewatch.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["tmp", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"gatewatch/installation.py" = ["UP036"]
"scripts/manage.py" = ["E402"]
