name: checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --constraint constraints.txt .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q gatewatch
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --constraint constraints.txt '.[dev,geo]'
      - run: python -m pip install --constraint constraints.txt --upgrade pip setuptools wheel
      - run: ruff check gatewatch integrations scripts tests
      - run: ruff format --check gatewatch integrations scripts tests
      - run: pip-audit --skip-editable
  linux-install:
    strategy:
      matrix:
        image: ['debian:12-slim', 'debian:13-slim', 'ubuntu:22.04', 'ubuntu:24.04']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - run: apt-get update -qq && apt-get install -y git python3 python3-venv ca-certificates gcc libpam0g-dev passwd
      - uses: actions/checkout@v4
      - run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install . && /tmp/venv/bin/python -m unittest discover -s tests -v
      - run: /tmp/venv/bin/python scripts/check_pam.py
      - run: python3 scripts/check_install.py
